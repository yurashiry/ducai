<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DucAI — выдача галочек</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f1115; color: #e8eaee; margin: 0; padding: 24px; }
  .card { max-width: 480px; margin: 0 auto; background: #161a21; border: 1px solid #2a303b; border-radius: 16px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; background: #0f1115; border: 1px solid #2a303b; border-radius: 10px; color: inherit; margin: 6px 0 12px; }
  button { background: #f5b301; color: #1a1400; border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
  button.x { background: #2a303b; color: #e8eaee; padding: 4px 10px; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a303b; }
  ul { list-style: none; padding: 0; }
  .muted { color: #8b94a3; font-size: 13px; }
  #msg { margin: 10px 0; min-height: 18px; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>🦆 DucAI — синие галочки</h1>
  <label class="muted">Адрес бэкенда (пусто = этот же сайт)</label>
  <input id="base" placeholder="https://ваш-бэкенд" />
  <label class="muted">Админ-токен (переменная ADMIN_TOKEN на сервере)</label>
  <input id="token" type="password" />
  <button id="load">Загрузить список</button>
  <div id="msg"></div>
  <div id="panel" hidden>
    <label class="muted">Добавить логин (даже если человек ещё не зарегистрирован)</label>
    <input id="login" placeholder="логин" />
    <button id="add">Выдать галочку ✓</button>
    <h3>Логины с галочкой</h3>
    <ul id="list"></ul>
    <div class="muted">Логины, зашитые в коде (src/lib/config.ts), удалить отсюда нельзя.</div>
  </div>
</div>
<script>
const $ = (i) => document.getElementById(i);
async function call(method, body) {
  const base = $("base").value.trim().replace(/\/$/, "");
  const r = await fetch(base + "/api/admin/verified", {
    method, headers: { "Content-Type": "application/json", "X-Admin-Token": $("token").value },
    body: body ? JSON.stringify(body) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Ошибка " + r.status);
  return d;
}
async function refresh() {
  try {
    const d = await call("GET");
    $("msg").textContent = ""; $("panel").hidden = false;
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    $("list").innerHTML =
      d.builtin.map((l) => "<li><span>" + esc(l) + ' ✓ <span class="muted">(в коде)</span></span></li>').join("") +
      d.logins.map((l) => "<li><span>" + esc(l) + ' ✓</span><button class="x" data-l="' + esc(l) + '">Забрать</button></li>').join("");
  } catch (e) { $("msg").textContent = "⚠ " + e.message; $("panel").hidden = true; }
}
$("load").onclick = refresh;
$("add").onclick = async () => { try { await call("POST", { login: $("login").value }); $("login").value = ""; refresh(); } catch (e) { $("msg").textContent = "⚠ " + e.message; } };
$("list").onclick = async (e) => { const l = e.target.dataset.l; if (l) { await call("DELETE", { login: l }); refresh(); } };
</script>
</body>
</html>
